# Rendered by the nginx image's envsubst step (only ${BACKEND_URL} is substituted).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the 10 MB upload limit enforced by the backend.
    client_max_body_size 12m;

    # Security headers (declared once here; locations below avoid add_header
    # so these are inherited everywhere).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # REST API → Spring Boot backend (keeps the /api prefix). Resolved per request
    # via Docker's DNS so the UI still starts while the backend is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_url ${BACKEND_URL};

    location /api/ {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (never cached).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
