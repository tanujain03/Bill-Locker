spring.application.name=bill-locker

# Optional, git-ignored local settings file: backend/.env (see .env.example).
# Found whether the app starts in backend/ (mvnw) or the repository root (IntelliJ).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ---- Database: local PostgreSQL ------------------------------------------------
# Real values live in backend/.env (or environment variables); never commit a password.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/BillLocker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Tables are created and kept up to date from the entity classes (no migration scripts).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hide PostgreSQL notices such as 'constraint ... does not exist, skipping' (not errors).
spring.jpa.properties.hibernate.jdbc.log.warnings=false

# ---- Uploads: files up to 10 MB (the bytes are stored in PostgreSQL) -----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- Reading documents (step 4) ------------------------------------------------
# A background worker reads newly uploaded documents every 2 seconds (false = paused).
app.processing.enabled=true

# ---- Reminders (step 6) ----------------------------------------------------------
# Warranty and service reminders are made every day at 08:00 and when the app starts.
app.reminders.enabled=true

# ---- Gmail import (step 7) ---------------------------------------------------------
# Set GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and GMAIL_TOKEN_KEY in backend/.env; how to
# get them is in docs/step-7-codes-and-gmail.md. Without them Gmail import stays off.
app.gmail.client-id=${GOOGLE_CLIENT_ID:}
app.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
app.gmail.token-key=${GMAIL_TOKEN_KEY:}
app.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/api/integrations/gmail/callback}
app.gmail.frontend-url=${FRONTEND_URL:http://localhost:5173}
# The background scanner (false = paused).
app.gmail.scan-enabled=true

# ---- Login tokens (JWT) --------------------------------------------------------
# Secret that signs the tokens: set JWT_SECRET (32+ characters) in backend/.env.
# If it is empty, a random secret is made at startup and everyone must log in again
# after each restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=24h
