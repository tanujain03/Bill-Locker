spring.application.name=bill-locker

# Optional, git-ignored local settings file: backend/.env (see .env.example).
# Found whether the app starts in backend/ (mvnw) or the repository root (IntelliJ).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ---- Database: local PostgreSQL ------------------------------------------------
# Real values live in backend/.env (or environment variables); never commit a password.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/BillLocker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Tables are created and kept up to date from the entity classes (no migration scripts).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Login tokens (JWT) --------------------------------------------------------
# Secret that signs the tokens: set JWT_SECRET (32+ characters) in backend/.env.
# If it is empty, a random secret is made at startup and everyone must log in again
# after each restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=24h

# ---- Forgot password -----------------------------------------------------------
# Reset links point at the frontend's /reset-password page and work once, for 30 minutes.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration=30m

# ---- Email (SMTP) --------------------------------------------------------------
# Sends the reset links. Set MAIL_USERNAME and MAIL_PASSWORD in backend/.env
# (for Gmail: your address + a 16-letter App Password, not your normal password).
# Without MAIL_USERNAME the link is only written to the backend log.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Log in to the server and switch the connection to TLS (encrypted) before sending.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Don't let a slow mail server hang the request forever (milliseconds).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Name shown as the sender; the address is MAIL_USERNAME (Gmail requires that).
app.mail.from-name=Bill Locker
